name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: swift test
    # KNOWN COVERAGE GAP: macOS 26 isn't a GitHub-hosted runner image
    # yet, so the CompanionRuntimePatch interposer (Sources/Companion-
    # RuntimePatch/Interpose.c) is NOT exercised in CI — its hooks
    # no-op cleanly on this Sonoma runner via the version check in
    # install_runtime_hooks. The workaround stays load-bearing on
    # 26.x dev machines until Apple fixes the runtime; tracked
    # alongside the C target's REMOVE_WHEN block. Add a `macos-26`
    # matrix entry the day GitHub Actions adds the image — at that
    # point CI catches any future regression in the interpose path
    # before a release.
    runs-on: macos-latest

    steps:
      - name: Checkout
        # Pinned to commit SHA (v6.0.3, node24). The prior pin was a
        # node20 action; GitHub defaults runners to node24 from
        # 2026-06-16 and removes node20 later in 2026. Updating: visit
        # https://github.com/actions/checkout/releases, copy the new
        # tag's commit SHA (peel annotated tags: `git ls-remote ...
        # 'refs/tags/vX.Y.Z^{}'`), paste here.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Swift 6.3.1 via swiftly
        # The hosted macos-latest image ships only Xcode 16.x (Swift 6.1),
        # so every prior CI run died at manifest parse (Package.swift needs
        # swift-tools 6.2). We need Swift 6.3 specifically: the source's
        # @MainActor annotations only type-check under the 6.3 concurrency
        # checker (the dev/ship toolchain); 6.2.1 rejects several main-actor
        # closure captures the codebase relies on. The setup-swift action
        # only knows versions up to 6.2.x, so install swift.org's 6.3.1
        # toolchain directly with swiftly and put its shim on PATH for the
        # later build/test steps. Builds against the active Xcode's macOS
        # SDK. Bump the version when the dev Xcode's Swift moves.
        run: |
          set -euxo pipefail
          curl -fsSL -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --quiet-shell-followup
          . "$HOME/.swiftly/env.sh"
          swiftly install 6.3.1
          swiftly use 6.3.1
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          swift --version

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test --enable-test-discovery
